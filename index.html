<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacrée Fleur | Mobile Fixed</title>

    <style>
        /* THE "FORCE MOBILE" FIX */
        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* This stops the horizontal scrolling */
            background-color: #f4f7f6;
            font-family: sans-serif;
            -webkit-text-size-adjust: 100%; /* Prevents iPhone from changing font size */
        }

        * {
            box-sizing: border-box;
            max-width: 100% !important; /* Forces EVERYTHING to stay inside the phone edges */
        }

        /* NAVIGATION MENU */
        nav {
            background: #003366;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        nav ul li a { color: white; text-decoration: none; font-size: 14px; }

        /* CONTENT CONTAINER */
        .container {
            padding: 15px;
        }

        /* IMAGE FIX - MAKES THEM FILL THE WIDTH */
        img {
            width: 100% !important;
            height: auto !important;
            display: block;
            margin: 10px 0;
            border-radius: 5px;
        }

        /* TEXT SIZING FOR MOBILE */
        h1 { font-size: 24px; color: #003366; }
        p { font-size: 16px; line-height: 1.5; color: #333; }

        /* MAP FIX */
        iframe {
            width: 100% !important;
            height: 250px !important;
            border: 0;
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: bold; font-size: 20px; margin-bottom: 5px;">SACRÉE FLEUR</div>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#gallery">Gallery</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Traditional French Beef</h1>
        <p>Located in Montmartre, Paris.</p>

        <img src="steak.jpg" alt="Steak">
        
        <div id="menu">
            <h2>Our Menu</h2>
            <p>Onion Soup - €12</p>
            <p>Filet de Bœuf - €32</p>
        </div>

        <img src="interior.jpg" alt="Interior">

        <div style="margin-top: 20px;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2623.7712318897!2d2.3458!3d48.887!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDjCsDUzJzEzLjIiTiAywrAyMCc0NC45IkU!5e0!3m2!1sen!2sfr!4v1611111111111!5m2!1sen!2sfr"></iframe>
        </div>
    </div>

</body>
</html>
