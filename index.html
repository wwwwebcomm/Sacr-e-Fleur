<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacrée Fleur | Final Version</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #f4f7f6; 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden; 
        }

        /* FIXING THE MENU - Making it 100% visible */
        nav {
            background-color: #003366 !important; /* Strong Navy Blue */
            width: 100%;
            padding: 20px 0;
            position: relative; /* Changed from sticky to ensure it shows up first */
            z-index: 9999;
            display: block !important;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo {
            color: #ffffff !important;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: row; /* Horizontal on desktop */
            justify-content: center;
            gap: 20px;
            padding: 0;
            margin: 0;
        }

        nav ul li a {
            color: #ffffff !important; /* Forces text to be white */
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
        }

        /* MOBILE MENU ADJUSTMENT */
        @media (max-width: 600px) {
            nav ul {
                flex-wrap: wrap;
                gap: 10px;
            }
            nav ul li a {
                font-size: 14px;
            }
        }

        /* Container and Content */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        img {
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            margin: 20px 0;
        }

        h1, h2 { font-family: 'Playfair Display', serif; color: #003366; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">SACRÉE FLEUR</div>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header style="background: #003366; color: white; padding: 80px 20px; text-align: center;">
        <div data-aos="fade-up">
            <h1 style="color: white;">Traditional French Beef</h1>
            <p>Authentic Cuisine in Montmartre</p>
        </div>
    </header>

    <div class="container" data-aos="fade-right">
        <h2>Our Story</h2>
        <p>Welcome to our kitchen. We specialize in high-quality meat served on hot stones.</p>
    </div>

    <div class="container" data-aos="zoom-in">
        <h2>The Food</h2>
        <img src="steak.jpg" alt="Steak">
        <img src="interior.jpg" alt="Restaurant Interior">
    </div>

    <div class="container" data-aos="fade-up">
        <h2>Find Us</h2>
        <iframe style="width:100%; height:300px; border:0; border-radius:8px;" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2623.360124707248!2d2.3468!3d48.8894"></iframe>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
