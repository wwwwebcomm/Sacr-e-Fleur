<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Sacrée Fleur | Final Fixed</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #f4f7f6; 
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* FIXED MENU: Guaranteed to show */
        nav {
            background-color: #003366 !important;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #ffd700; /* Gold line to make it pop */
        }

        .logo {
            color: white !important;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            display: block;
            margin-bottom: 10px;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0;
        }

        nav ul li a {
            color: white !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* CONTAINER FIX */
        .container {
            width: 95%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* IMAGE FIX */
        img {
            width: 100% !important;
            height: auto !important;
            border-radius: 5px;
            margin: 15px 0;
        }

        /* THE MAP BOX - This is built to never break */
        .map-wrapper {
            width: 100%;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
            border: 2px solid #003366;
        }

        .map-wrapper iframe {
            width: 100% !important;
            height: 350px !important;
            border: 0;
            display: block;
        }

        h1, h2 { font-family: 'Playfair Display', serif; color: #003366; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">SACRÉE FLEUR</a>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Map</a></li>
        </ul>
    </nav>

    <header style="background: #003366; color: white; padding: 50px 20px; text-align: center;">
        <div data-aos="fade-up">
            <h1 style="color: white;">Traditional French Beef</h1>
            <p>Authentic Cuisine in Montmartre</p>
        </div>
    </header>

    <div class="container" data-aos="fade-right">
        <h2>About</h2>
        <p>Welcome to Sacrée Fleur. The best steak in Paris.</p>
    </div>

    <div class="container" data-aos="zoom-in">
        <h2>Gallery</h2>
        <img src="steak.jpg" alt="Steak">
        <img src="interior.jpg" alt="Interior">
    </div>

    <div class="container" data-aos="fade-up" id="contact">
        <h2>Our Location</h2>
        <p>50 Rue de Clignancourt, 75018 Paris</p>
        
        <div class="map-wrapper">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2623.743577741352!2d2.346850276921387!3d48.88214290035136!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66e435987a91b%3A0xc36495f5909248f2!2sSacr%C3%A9e%20Fleur!5e0!3m2!1sen!2s!4v1700000000000" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
